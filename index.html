<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarot Souls Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    
      body {
      background-color: #000000;
      background-image: url('firekeepers.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
      color: #f0e6d2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    

    .container {
      background: rgba(18, 16, 22, 0);
      border: 2px solid #8c734b;
      border-radius: 12px;
      padding: 25px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(2px);
    }

    h1 { font-size: 1.5rem; color: #d4af37; margin-bottom: 15px; letter-spacing: 1px; }

    .stage {
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      position: relative;
    }

    #carta-img {
      max-height: 340px;
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
      display: none;
    }

    #nome-carta { font-size: 1.2rem; font-weight: bold; color: #ffd700; min-height: 28px; margin-bottom: 10px; }
    #texto-atributo { font-size: 1rem; line-height: 1.5; color: #e0dcd3; min-height: 60px; margin-bottom: 20px; font-style: italic; }
    
    .controles { display: flex; flex-direction: column; gap: 10px; }
    input[type="text"] {
      padding: 12px; border-radius: 6px; border: 1px solid #8c734b;
      background: #1e1b24; color: #fff; font-size: 1rem; text-align: center;
    }
    button {
      padding: 12px 20px; border: none; border-radius: 6px;
      background: #8c734b; color: #121016; font-weight: bold; font-size: 1rem; cursor: pointer;
    }
    button:hover { background: #d4af37; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Tarot Souls</h1>

    <div class="stage">
      <img id="carta-img" src="back.jpg" alt="Carta de Tarot" title="Clique para tirar sua carta">
    </div>

    <div id="nome-carta"></div>
    <div id="texto-atributo">Clique em iniciar para ouvir a narradora.</div>

    <div class="controles">
      <div id="area-inicio">
        <button id="btn-iniciar">Iniciar Leitura</button>
      </div>

      <div id="area-jogo" class="hidden">
        <div id="contador-baralho" style="font-size: 0.85rem; color: #a8987a; margin-bottom: 8px;"></div>
        <button id="btn-reiniciar" style="background: transparent; border: 1px solid #8c734b; color: #d4af37;">Embaralhar Novo Jogo</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // CONFIGURAÇÃO DA PASTA E EXTENSÃO DAS IMAGENS E SONS
    // =========================================================================
    const PASTA_IMAGENS = "";
    const EXTENSAO_IMAGEM = ".jpg";
    const PASTA_SONS = "";

    // =========================================================================
    // BARALHO COMPLETO (78 CARTAS)
    // =========================================================================
    const baralho = [
      // --- ARCANOS MAIORES (22 Cartas) ---
      { arquivo: "fool",        titulo: "The Fool",           atributo: "Novos começos, espontaneidade, fé no universo e liberdade." },
      { arquivo: "magician",    titulo: "The Magician",       atributo: "Poder pessoal, manifestação, habilidade e ação consciente." },
      { arquivo: "priestess",   titulo: "The High Priestess", atributo: "Intuição, mistério, sabedoria interior e conhecimento oculto." },
      { arquivo: "empress",     titulo: "The Empress",        atributo: "Fertilidade, abundância, natureza e cuidado maternal." },
      { arquivo: "emperor",     titulo: "The Emperor",        atributo: "Autoridade, estrutura, estabilidade e liderança." },
      { arquivo: "hierophant",  titulo: "The Hierophant",     atributo: "Tradição, espiritualidade, aprendizado e sabedoria." },
      { arquivo: "lovers",      titulo: "The Lovers",         atributo: "Escolhas importantes, harmonia, relacionamentos e alinhamento de valores." },
      { arquivo: "chariot",     titulo: "The Chariot",        atributo: "Determinação, força de vontade, vitória e controle." },
      { arquivo: "strength",    titulo: "Strength",           atributo: "Coragem, paciência, compaixão e domínio interior." },
      { arquivo: "hermit",      titulo: "The Hermit",         atributo: "Introspecção, busca pela verdade, solidão e guia interior." },
      { arquivo: "wheel",       titulo: "Wheel of Fortune",   atributo: "Mudanças de ciclo, destino, sorte e pontos de virada." },
      { arquivo: "justice",     titulo: "Justice",            atributo: "Justiça, verdade, causa e efeito, integridade e equilíbrio." },
      { arquivo: "hanged",      titulo: "The Hanged Man",     atributo: "Pausa, rendição, nova perspectiva e desapego." },
      { arquivo: "death",       titulo: "Death",              atributo: "Fim de um ciclo, transformação profunda, renascimento e transição." },
      { arquivo: "temperence",  titulo: "Temperance",         atributo: "Equilíbrio, paciência, moderação e harmonia." },
      { arquivo: "devil",       titulo: "The Devil",          atributo: "Apego, tentações, sombras interiores e libertação de vícios." },
      { arquivo: "tower",       titulo: "The Tower",          atributo: "Mudança brusca, revelação e reconstrução." },
      { arquivo: "star",        titulo: "The Star",           atributo: "Esperança, inspiração, serenidade e renovação." },
      { arquivo: "moon",        titulo: "The Moon",           atributo: "Ilusão, medos ocultos, intuição profunda e mistério." },
      { arquivo: "sun",         titulo: "The Sun",            atributo: "Alegria, sucesso, vitalidade e clareza." },
      { arquivo: "judgement",   titulo: "Judgement",          atributo: "Despertar, chamado interior, renovação e avaliação." },
      { arquivo: "world",       titulo: "The World",          atributo: "Conclusão, realização, plenitude e sucesso." },

      // --- PAUS / WANDS (14 Cartas) ---
      { arquivo: "aceW",        titulo: "Ace of Wands",       atributo: "Inspiração, novo começo criativo, entusiasmo e potencial." },
      { arquivo: "2W",          titulo: "Two of Wands",       atributo: "Planejamento, visão de futuro, decisões e expansão." },
      { arquivo: "3W",          titulo: "Three of Wands",     atributo: "Progresso, expansão, oportunidades e olhar para o horizonte." },
      { arquivo: "4W",          titulo: "Four of Wands",      atributo: "Celebração, harmonia, lar e conquista compartilhada." },
      { arquivo: "5W",          titulo: "Five of Wands",      atributo: "Competição, conflitos menores, desafios e debate." },
      { arquivo: "6W",          titulo: "Six of Wands",       atributo: "Vitória, reconhecimento público, sucesso e autoconfiança." },
      { arquivo: "7W",          titulo: "Seven of Wands",     atributo: "Perseverança, defesa de posição, coragem e resistência." },
      { arquivo: "8W",          titulo: "Eight of Wands",     atributo: "Rapidez, movimento, notícias chegando e ação imediata." },
      { arquivo: "9W",          titulo: "Nine of Wands",      atributo: "Resiliência, persistência, cautela e última barreira antes da vitória." },
      { arquivo: "10W",         titulo: "Ten of Wands",       atributo: "Sobrecarga, excesso de responsabilidades e esforço final." },
      { arquivo: "pageW",       titulo: "Page of Wands",      atributo: "Entusiasmo, exploração, novas ideias e espírito livre." },
      { arquivo: "knightW",     titulo: "Knight of Wands",    atributo: "Ação impulsiva, aventura, paixão e energia intensa." },
      { arquivo: "queenW",      titulo: "Queen of Wands",     atributo: "Confiança, determinação, independência e carisma." },
      { arquivo: "kingW",       titulo: "King of Wands",      atributo: "Liderança visionária, empreendedorismo, honra e ousadia." },

      // --- COPAS / CUPS (14 Cartas) ---
      { arquivo: "aceC",        titulo: "Ace of Cups",        atributo: "Novo amor, abertura emocional, compaixão e criatividade." },
      { arquivo: "2C",          titulo: "Two of Cups",        atributo: "União, parceria harmoniosa, conexão mútua e afeto." },
      { arquivo: "3C",          titulo: "Three of Cups",      atributo: "Amizade, celebração, alegria compartilhada e comunidade." },
      { arquivo: "4C",          titulo: "Four of Cups",       atributo: "Apatia, contemplação, reavaliação e oportunidades ignoradas." },
      { arquivo: "5C",          titulo: "Five of Cups",       atributo: "Perda, arrependimento, foco no que se foi e necessidade de seguir em frente." },
      { arquivo: "6C",          titulo: "Six of Cups",        atributo: "Nostalgia, memórias felizes, inocência e reencontros." },
      { arquivo: "7C",          titulo: "Seven of Cups",      atributo: "Muitas escolhas, ilusões, sonhos e necessidade de foco." },
      { arquivo: "8C",          titulo: "Eight of Cups",      atributo: "Abandono do que não serve mais, busca por sentido maior e partida." },
      { arquivo: "9C",          titulo: "Nine of Cups",       atributo: "Satisfação, desejos realizados, gratidão e prazer." },
      { arquivo: "10C",         titulo: "Ten of Cups",        atributo: "Felicidade plena, harmonia familiar, paz emocional e realização." },
      { arquivo: "pageC",       titulo: "Page of Cups",       atributo: "Sensibilidade, mensagens afetivas, intuição e criatividade." },
      { arquivo: "knightC",     titulo: "Knight of Cups",     atributo: "Romantismo, charme, imaginação e seguir o coração." },
      { arquivo: "queenC",      titulo: "Queen of Cups",      atributo: "Empatia, cuidado emocional, intuição profunda e serenidade." },
      { arquivo: "kingC",       titulo: "King of Cups",       atributo: "Equilíbrio emocional, sabedoria, diplomacia e compaixão." },

      // --- ESPADAS / SWORDS (14 Cartas) ---
      { arquivo: "aceS",        titulo: "Ace of Swords",      atributo: "Clareza mental, verdade, novas ideias e triunfo intelectual." },
      { arquivo: "2S",          titulo: "Two of Swords",      atributo: "Indecisão, impasse, escolha difícil e necessidade de equilíbrio." },
      { arquivo: "3S",          titulo: "Three of Swords",    atributo: "Dor emocional, tristeza, separação e cura necessária." },
      { arquivo: "4S",          titulo: "Four of Swords",     atributo: "Descanso, recuperação, meditação e pausa estratégica." },
      { arquivo: "5S",          titulo: "Five of Swords",     atributo: "Conflito, vitória vazia, tensão e necessidade de escolher suas batalhas." },
      { arquivo: "6S",          titulo: "Six of Swords",      atributo: "Transição, deixar problemas para trás e seguir para águas calmas." },
      { arquivo: "7S",          titulo: "Seven of Swords",    atributo: "Estratégia, discrição, astúcia e agir com cautela." },
      { arquivo: "8S",          titulo: "Eight of Swords",    atributo: "Sensação de aprisionamento, medos mentais e autolimitação." },
      { arquivo: "9S",          titulo: "Nine of Swords",     atributo: "Ansiedade, preocupação excessiva, insônia e angústia." },
      { arquivo: "10S",         titulo: "Ten of Swords",      atributo: "Fim definitivo, superação de crise e recomeço após o fundo do poço." },
      { arquivo: "pageS",       titulo: "Page of Swords",     atributo: "Curiosidade, vigilância, mente ágil e busca pela verdade." },
      { arquivo: "knightS",     titulo: "Knight of Swords",   atributo: "Determinação rápida, ambição, assertividade e ação direta." },
      { arquivo: "queenS",      titulo: "Queen of Swords",    atributo: "Independência, clareza de pensamento, honestidade e percepção." },
      { arquivo: "kingS",       titulo: "King of Swords",     atributo: "Autoridade intelectual, lógica, verdade e julgamento justo." },

      // --- OUROS / PENTACLES (14 Cartas) ---
      { arquivo: "aceP",        titulo: "Ace of Pentacles",   atributo: "Nova oportunidade financeira, prosperidade, segurança e manifestação." },
      { arquivo: "2P",          titulo: "Two of Pentacles",   atributo: "Equilíbrio de prioridades, adaptabilidade e gestão de recursos." },
      { arquivo: "3P",          titulo: "Three of Pentacles", atributo: "Trabalho em equipe, colaboração, aprendizado e reconhecimento." },
      { arquivo: "4P",          titulo: "Four of Pentacles",  atributo: "Estabilidade, segurança material, controle e apego." },
      { arquivo: "5P",          titulo: "Five of Pentacles",  atributo: "Dificuldade material, sensação de escassez e busca por apoio." },
      { arquivo: "6P",          titulo: "Six of Pentacles",   atributo: "Generosidade, partilha, equilíbrio entre dar e receber." },
      { arquivo: "7P",          titulo: "Seven of Pentacles", atributo: "Paciência, investimento a longo prazo e avaliação de resultados." },
      { arquivo: "8P",          titulo: "Eight of Pentacles", atributo: "Dedicação, aperfeiçoamento, trabalho duro e maestria." },
      { arquivo: "9P",          titulo: "Nine of Pentacles",  atributo: "Independência financeira, abundância, autossuficiência e conquista." },
      { arquivo: "10P",         titulo: "Ten of Pentacles",   atributo: "Riqueza duradoura, legado, estabilidade familiar e realização." },
      { arquivo: "pageP",       titulo: "Page of Pentacles",  atributo: "Novos estudos, foco prático, oportunidade e dedicação." },
      { arquivo: "knightP",     titulo: "Knight of Pentacles",atributo: "Persistência, responsabilidade, rotina sólida e confiabilidade." },
      { arquivo: "queenP",      titulo: "Queen of Pentacles", atributo: "Prosperidade, cuidado prático, conforto e generosidade." },
      { arquivo: "kingP",       titulo: "King of Pentacles",  atributo: "Sucesso material, liderança, segurança e abundância." }
    ];

    // =========================================================================
    // LÓGICA DO JOGO (SORTEAR AO CLICAR NA CARTA E EXCLUIR DO BARALHO)
    // =========================================================================
    let baralhoDisponivel = [];
    let podeClicarNaCarta = false;
    let audioAtual = null;

    const cartaImg = document.getElementById('carta-img');
    const nomeCartaEl = document.getElementById('nome-carta');
    const textoAtributoEl = document.getElementById('texto-atributo');
    const areaInicio = document.getElementById('area-inicio');
    const areaJogo = document.getElementById('area-jogo');
    const contadorBaralhoEl = document.getElementById('contador-baralho');
    const btnIniciar = document.getElementById('btn-iniciar');
    const btnReiniciar = document.getElementById('btn-reiniciar');

    // Fallbacks automáticos caso a extensão ou maiúscula da imagem varie
    cartaImg.onerror = function() {
      const srcAtual = cartaImg.getAttribute('src');
      if (srcAtual.endsWith('.jpg')) {
        cartaImg.src = srcAtual.replace('.jpg', '.png');
      } else if (srcAtual.includes('back.png')) {
        cartaImg.src = srcAtual.replace('back.png', 'Back.png');
      } else if (srcAtual.includes('Back.png')) {
        cartaImg.src = srcAtual.replace('Back.png', 'Back.jpg');
      } else {
        textoAtributoEl.innerHTML = `<span style="color:#ff6b6b;">Não achei a imagem em: <b>${srcAtual}</b></span>`;
      }
    };

    function falarTexto(texto) {
      window.speechSynthesis.cancel();
      const fala = new SpeechSynthesisUtterance(texto);
      fala.lang = 'pt-BR';

      const todasAsVozes = window.speechSynthesis.getVoices();
      let vozesBR = todasAsVozes.filter(v =>
        v.lang.toLowerCase() === 'pt-br' ||
        v.lang.toLowerCase() === 'pt_br' ||
        v.name.toLowerCase().includes('brazil') ||
        v.name.toLowerCase().includes('brasil')
      );

      if (vozesBR.length === 0) {
        vozesBR = todasAsVozes.filter(v =>
          v.lang.toLowerCase().startsWith('pt') &&
          !v.lang.toLowerCase().includes('pt-pt') &&
          !v.name.toLowerCase().includes('portugal')
        );
      }

      if (vozesBR.length > 0) {
        const vozEscolhida = vozesBR[Math.floor(Math.random() * vozesBR.length)];
        fala.voice = vozEscolhida;
        fala.lang = vozEscolhida.lang;
      }

      fala.pitch = 0.95;
      fala.rate = 0.95;
      window.speechSynthesis.speak(fala);
    }

    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

    function atualizarContador() {
      contadorBaralhoEl.textContent = `Cartas restantes no deck: ${baralhoDisponivel.length} de ${baralho.length}`;
    }

    // Equivalente ao bloco "quando bandeira verde for clicado"
    function iniciarJogo() {
      window.speechSynthesis.cancel();
      podeClicarNaCarta = false;

      // Restaura todas as 78 cartas para uma nova tiragem
      baralhoDisponivel = [...baralho];
      atualizarContador();

      areaInicio.classList.add('hidden');
      areaJogo.classList.add('hidden');
      nomeCartaEl.textContent = "";
      textoAtributoEl.textContent = "A narradora está falando...";

      cartaImg.style.display = 'none';
      cartaImg.src = PASTA_IMAGENS + "back" + EXTENSAO_IMAGEM;

      const numAudio = Math.floor(Math.random() * 10) + 1;
      if (audioAtual) audioAtual.pause();
      audioAtual = new Audio(`${PASTA_SONS}${numAudio}.mp3`);

      const liberarCartaParaClique = () => {
        setTimeout(() => {
          cartaImg.style.display = 'block';
          podeClicarNaCarta = true;
          textoAtributoEl.textContent = "Clique na carta para tirar sua sorte.";
          areaJogo.classList.remove('hidden');
        }, 500);
      };

      audioAtual.onended = liberarCartaParaClique;
      audioAtual.onerror = liberarCartaParaClique;

      audioAtual.play().catch(() => {
        liberarCartaParaClique();
      });
    }

    // Equivalente ao bloco "quando este ator for clicado"
    function sortearCartaAoClicar() {
      if (!podeClicarNaCarta) return;

      if (baralhoDisponivel.length === 0) {
        nomeCartaEl.textContent = "Baralho Esgotado";
        textoAtributoEl.textContent = "Todas as cartas já foram reveladas. Clique em 'Embaralhar Novo Jogo'.";
        falarTexto("Todas as cartas do baralho já foram tiradas.");
        return;
      }

      // 1. Sorteia aleatoriamente entre as cartas ainda disponíveis no deck
      const indiceSorteado = Math.floor(Math.random() * baralhoDisponivel.length);
      const cartaEscolhida = baralhoDisponivel[indiceSorteado];

      // 2. Exclui a carta sorteada do deck para não repetir na próxima tiragem
      baralhoDisponivel.splice(indiceSorteado, 1);
      atualizarContador();

      // 3. Revela a carta e mostra o título e significado
      cartaImg.src = PASTA_IMAGENS + cartaEscolhida.arquivo + EXTENSAO_IMAGEM;
      nomeCartaEl.textContent = cartaEscolhida.titulo;
      textoAtributoEl.textContent = cartaEscolhida.atributo;

      // 4. Narra o significado da carta em Português (Brasil)
      falarTexto(cartaEscolhida.atributo);
    }

    btnIniciar.addEventListener('click', iniciarJogo);
    btnReiniciar.addEventListener('click', iniciarJogo);
    cartaImg.addEventListener('click', sortearCartaAoClicar);
  </script>
</body>
</html>
